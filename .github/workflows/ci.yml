name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Run the CLI against the fixture transcripts
        run: |
          node dist/src/cli.js --claude-dir test/fixtures/claude --out "$RUNNER_TEMP/out" --tz UTC
          test -s "$RUNNER_TEMP/out/claude-hitmap.svg"
          test -s "$RUNNER_TEMP/out/claude-hitmap.json"
